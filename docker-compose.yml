version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: muvora-backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
      - ./backend:/app
    environment:
      - PROJECT_NAME=MuVora
      - DEBUG=False
      - MODEL_PATH=/models/sentiment_bilstm.keras
      - VOCAB_PATH=/models/vocab.json
      - METADATA_PATH=/models/metadata.json
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: muvora-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
